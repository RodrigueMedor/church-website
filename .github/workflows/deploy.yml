name: Deploy to DigitalOcean

on:
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: rodriguemedor/church-website/backend
  IMAGE_FRONTEND: rodriguemedor/church-website/frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
          build-args: |
            REACT_APP_API_URL=
            REACT_APP_YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
            REACT_APP_YOUTUBE_CHANNEL_ID=${{ secrets.YOUTUBE_CHANNEL_ID }}
            REACT_APP_ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            REACT_APP_ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            REACT_APP_ADMIN_NAME=${{ secrets.ADMIN_NAME }}
            REACT_APP_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /opt/church-website

            # Discard local changes (e.g. .env) and match origin exactly
            git fetch origin
            git reset --hard origin/master

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export GITHUB_REPOSITORY=rodriguemedor/church-website

            # Free port 80/443 for Docker frontend (stop host nginx if running)
            systemctl stop nginx 2>/dev/null || true
            docker stop $(docker ps -q --filter "name=nginx") 2>/dev/null || true

            # Write all production secrets to .env (overwrite to ensure freshness)
            printf '%s\n' \
              "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
              "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
              "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" \
              "MAIL_HOST=${{ secrets.MAIL_HOST }}" \
              "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}" \
              "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" \
              "MAIL_NOTIFY_TO=${{ secrets.MAIL_NOTIFY_TO }}" \
              > .env

            docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml down
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
