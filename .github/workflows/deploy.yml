name: Deploy to DigitalOcean

on:
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: rodriguemedor/church-website/backend
  IMAGE_FRONTEND: rodriguemedor/church-website/frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
          build-args: |
            REACT_APP_API_URL=https://${{ secrets.DOMAIN }}
            REACT_APP_YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
            REACT_APP_YOUTUBE_CHANNEL_ID=${{ secrets.YOUTUBE_CHANNEL_ID }}
            REACT_APP_ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            REACT_APP_ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            REACT_APP_ADMIN_NAME=${{ secrets.ADMIN_NAME }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /opt/church-website

            # Discard local changes (e.g. .env) and match origin exactly
            git fetch origin
            git reset --hard origin/master

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export GITHUB_REPOSITORY=rodriguemedor/church-website

            # Create .env with production secrets on first deploy
            touch .env
            grep -q '^JWT_SECRET=' .env 2>/dev/null || \
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            grep -q '^DB_PASSWORD=' .env 2>/dev/null || \
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env

            docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
