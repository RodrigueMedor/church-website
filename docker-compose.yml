services:
  postgres:
    image: postgres:16-alpine
    container_name: church-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: church_db
      POSTGRES_USER: church_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-church_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church_admin -d church_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: church-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/church_db
      DB_USERNAME: church_admin
      DB_PASSWORD: ${DB_PASSWORD:-church_pass}
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: https://fhbck.org,https://www.fhbck.org
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: church-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  logs_data:
