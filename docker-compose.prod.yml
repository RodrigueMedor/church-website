# Production overrides: use pre-built images from registry
services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-rodriguemedor/church-website}/backend:latest

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-rodriguemedor/church-website}/frontend:latest
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
