server {
    listen 80;
    server_name fhbck.org www.fhbck.org;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fhbck.org www.fhbck.org;

    ssl_certificate /etc/letsencrypt/live/fhbck.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fhbck.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # HSTS (1 year, include subdomains, preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Frontend static files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/xml image/svg+xml;
    gzip_min_length 256;

    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
