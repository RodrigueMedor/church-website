server:
  port: 8080
  ssl:
    enabled: false
  http2:
    enabled: true

spring:
  application:
    name: church-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/church_db}
    username: ${DB_USERNAME:church_admin}
    password: ${DB_PASSWORD:church_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:4a6f686e446f6553656372657456657279566572795365637265744b6579466f724a57545369676e696e67}
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000

  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-size: 52428800

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:80}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    notify-to: ${MAIL_NOTIFY_TO:info@fhbck.org}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui
    operations-sorter: method

logging:
  level:
    com.fhbck: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /app/logs/church-backend.log
    max-size: 10MB
    max-history: 7
